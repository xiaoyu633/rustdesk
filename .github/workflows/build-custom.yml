name: Build Custom RustDesk Clients

# ============================================================
# 为自建 RustDesk 服务器构建定制客户端
# 服务器：rd.fuyou135.cn / id.fuyou135.cn
# ============================================================
# 触发方式：
#   1. 手动触发（Actions 页面 Run workflow）
#   2. 推送 config/custom.txt 变更时自动触发
#   3. 定时检查上游新版本（每天 UTC 2:00 = 北京时间 10:00）
on:
  workflow_dispatch:
    inputs:
      rustdesk_version:
        description: 'RustDesk 版本 (留空=最新版)'
        required: false
        default: ''
      force_build:
        description: '强制重新构建（忽略已发布的 Release）'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'config/custom.txt'
      - '.github/workflows/build-custom.yml'
      - 'scripts/inject-config.sh'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  # ============================================
  # 任务0：检测上游最新版本 & 判断是否需要构建
  # ============================================
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      need_build: ${{ steps.ver.outputs.need_build }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检测最新版本
        id: ver
        run: |
          # 手动触发且勾选"强制构建"时，跳过 Release 检查直接重建
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "=== 强制构建模式：跳过版本/Release 检查 ==="
            VERSION="${{ github.event.inputs.rustdesk_version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -sL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.tag_name // empty')
              [ -z "$VERSION" ] && VERSION=$(curl -sL "https://api.github.com/repos/rustdesk/rustdesk/tags?per_page=1" | jq -r '.[0].name // empty')
            fi
            [ -z "$VERSION" ] && { echo "FAIL: 无法获取上游版本号"; exit 1; }
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "need_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "${{ github.event.inputs.rustdesk_version }}" ]; then
            VERSION="${{ github.event.inputs.rustdesk_version }}"
          else
            VERSION=$(curl -sL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.tag_name // empty')
            [ -z "$VERSION" ] && VERSION=$(curl -sL "https://api.github.com/repos/rustdesk/rustdesk/tags?per_page=1" | jq -r '.[0].name // empty')
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: 无法获取上游版本号"
            exit 1
          fi
          echo "上游最新版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 重要：只有"已正式发布(非草稿)且带附件"的 Release 才算构建完成。
          # 只看 tag 是否会被失败的草稿 Release 永久锁死（草稿也会占用 tag）。
          TAG="custom-$VERSION"
          DRAFT=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
                    --jq '.draft' 2>/dev/null || echo "missing")
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
                    --jq '.assets | length' 2>/dev/null || echo "0")

          echo "已有 Release: draft=$DRAFT, assets=$ASSETS"

          if [ "$DRAFT" = "false" ] && [ "$ASSETS" -gt 0 ] 2>/dev/null; then
            echo "该版本已成功构建并发布，跳过"
            echo "need_build=false" >> $GITHUB_OUTPUT
          else
            if [ "$DRAFT" != "missing" ]; then
              echo "发现不完整 Release（草稿或无附件），将其删除后重建"
              RID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null || echo "")
              [ -n "$RID" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/$RID" 2>/dev/null || true
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
            fi
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 任务1：Windows x64 客户端
  # ============================================
  build-windows:
    needs: check-version
    if: needs.check-version.outputs.need_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 关键：必须 --recursive，libs/hbb_common 是 submodule
      - name: 克隆源码（含 submodule）
        shell: bash
        run: |
          git clone --depth 1 --recursive --branch "${{ needs.check-version.outputs.version }}" \
            https://github.com/rustdesk/rustdesk.git source 2>/dev/null \
            || git clone --depth 1 --recursive https://github.com/rustdesk/rustdesk.git source
          cd source && git log --oneline -1
          echo "--- submodule 校验 ---"
          ls -la libs/hbb_common/src/config.rs

      - name: 注入服务器配置
        shell: bash
        run: bash scripts/inject-config.sh config/custom.txt source

      # ==========================================================
      # Windows 上 RustDesk 的 C 依赖必须走 vcpkg（scrap/magnum-opus 的
      # build.rs：非 Linux 时读 VCPKG_ROOT，找不到就 panic）。
      # triplet 固定 x64-windows-static（与 build.rs 推导一致）。
      # 依赖最小集（默认 features 无 hwcodec/vram，故不需要 ffmpeg）：
      #   scrap        -> libyuv, libvpx(vpx), aom
      #   magnum-opus  -> opus
      #   其他         -> libjpeg-turbo
      #   libsodium    -> x64 用 crate 自带源码编译，无需 vcpkg
      # ==========================================================
      - name: 缓存 vcpkg 二进制包
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\bincache
          key: vcpkg-x64-windows-static-9e593bb-aom-vpx-yuv-jpeg-opus

      - name: 安装 vcpkg（固定官方 commit，与官方流水线一致）
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: 安装 RustDesk 系统依赖
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg\bincache
        run: |
          # 关键：必须离开 checkout 目录再执行——fork 根目录有上游的 vcpkg.json，
          # vcpkg 在该目录运行会进入 manifest 模式并拒绝"install 包名"参数。
          # 换到干净的临时目录即为 classic 模式。
          WORKDIR=$(mktemp -d) && cd "$WORKDIR"
          mkdir -p "$VCPKG_ROOT/bincache"
          # 经典模式安装（不用 manifest，否则会把 ffmpeg 也拉进来编译）
          if ! "$VCPKG_ROOT/vcpkg" install aom libvpx libyuv libjpeg-turbo opus \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            echo "FAIL: vcpkg 依赖安装失败"
            find "$VCPKG_ROOT/buildtrees" -name "*-rel-out.log" 2>/dev/null | head -5 | while read -r f; do
              echo "=== $f ==="; tail -30 "$f"
            done
            exit 1
          fi
          echo "=== 关键库就位校验 ==="
          LIBDIR="$VCPKG_ROOT/installed/x64-windows-static/lib"
          FAILED=0
          for lib in aom vpx yuv jpeg opus; do
            if ls "$LIBDIR" | grep -qi "$lib"; then
              echo "OK   $lib"
            else
              echo "FAIL $lib not found in $LIBDIR"; FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: 编译
        working-directory: source
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: 编译失败时输出日志尾部
        if: failure()
        shell: bash
        run: tail -60 /tmp/build.log || true

      - name: 校验产物含自建服务器地址
        shell: bash
        run: |
          BIN=source/target/release/rustdesk.exe
          if [ ! -f "$BIN" ]; then
            echo "FAIL: 二进制未生成: $BIN"; exit 1
          fi
          if strings "$BIN" | grep -q "fuyou135.cn"; then
            echo "OK: 产物已确认包含自建服务器地址"
            strings "$BIN" | grep "fuyou135.cn" | head -5
          else
            echo "FAIL: 产物中未找到服务器地址 —— 注入失败，拒绝发布"
            exit 1
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          cp source/target/release/rustdesk.exe dist/RustDesk-Windows-x64.exe
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist/
          if-no-files-found: error

  # ============================================
  # 任务2：macOS Intel (x86_64) 客户端
  # ============================================
  build-macos-x86:
    needs: check-version
    if: needs.check-version.outputs.need_build == 'true'
    # macos-13 已退役；官方 x64 构建现用 macos-15-intel（Intel 芯片）
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      # 说明：不再依赖 cargo-bundle —— 新版 cargo-bundle 不认 RustDesk
      # Cargo.toml 里的旧字段 `osx_minimum_system_version`，直接手动构造 .app。

      # aom/libvpx 的 x86_64 汇编必须用 NASM 2.x，brew 的 nasm 是 3.x（不兼容重写版）
      - name: 安装构建工具（LLVM / pkg-config / NASM 2.16）
        run: |
          brew install llvm pkg-config
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q -o nasm-2.16.03-macosx.zip
          sudo cp -f nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      # ==========================================================
      # macOS 上 scrap/magnum-opus 的 build.rs 同样要求 VCPKG_ROOT
      # （homebrew fallback 仅限 arm64），triplet 固定 x64-osx。
      # 最小集与 Windows 相同，无需 ffmpeg（默认 features 不含 hwcodec）。
      # ==========================================================
      - name: 缓存 vcpkg 二进制包
        uses: actions/cache@v4
        with:
          path: ~/vcpkg-bincache
          key: vcpkg-x64-osx-9e593bb-aom-vpx-yuv-jpeg-opus

      # vcpkg 整套目录缓存：命中后秒过，无需 clone + 下载
      - name: 缓存 vcpkg 目录
        id: vcpkgdir
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-tool-x64-osx-9e593bb-2026-07-27

      # 不用 lukka/run-vcpkg：其 bootstrap 会直连 github.com 下载 vcpkg-macos，
      # runner 上常出现 "Failed to connect to github.com:443" 导致 job 失败。
      # 改为手动 clone 源码 + 多源下载预编译可执行文件。
      - name: 安装 vcpkg（手动，多源回退）
        if: steps.vcpkgdir.outputs.cache-hit != 'true'
        run: |
          set -e
          VCPKG_DIR="${{ github.workspace }}/vcpkg"
          rm -rf "$VCPKG_DIR"
          echo "=== 1) 克隆 vcpkg 源码 ==="
          CLONE_OK=0
          for repo in https://github.com/microsoft/vcpkg.git \
                      https://ghfast.top/https://github.com/microsoft/vcpkg.git \
                      https://gh-proxy.com/https://github.com/microsoft/vcpkg.git; do
            rm -rf "$VCPKG_DIR"
            echo "尝试: $repo"
            if git clone --depth 1 "$repo" "$VCPKG_DIR" 2>/dev/null; then
              CLONE_OK=1; echo "OK 采用: $repo"; break
            fi
          done
          [ "$CLONE_OK" = "1" ] || { echo "FAIL: vcpkg 源码克隆失败（所有源）"; exit 1; }

          cd "$VCPKG_DIR"
          # 切到固定官方 commit；失败则沿用 HEAD，不中断流程
          if git fetch -q --depth 1 origin 9e593bb18ea69cc5095e012465dcd675a822ed0d 2>/dev/null \
             && git checkout -q -f 9e593bb18ea69cc5095e012465dcd675a822ed0d 2>/dev/null; then
            echo "已切到固定 commit"
          else
            echo "WARN: 无法切到固定 commit，沿用 HEAD（不影响依赖构建）"
          fi
          echo "vcpkg commit: $(git rev-parse --short HEAD)"

          echo "=== 2) 下载预编译 vcpkg 可执行文件（多源回退） ==="
          BASE="https://github.com/microsoft/vcpkg-tool/releases/download/2026-07-27/vcpkg-macos"
          for url in "$BASE" \
                     "https://ghfast.top/$BASE" \
                     "https://gh-proxy.com/$BASE"; do
            echo "尝试: $url"
            if curl -fsSL --connect-timeout 15 --max-time 240 -o "$VCPKG_DIR/vcpkg" "$url"; then
              xattr -d com.apple.quarantine "$VCPKG_DIR/vcpkg" 2>/dev/null || true
              chmod +x "$VCPKG_DIR/vcpkg"
              if "$VCPKG_DIR/vcpkg" version >/dev/null 2>&1; then
                echo "OK 采用: $url"
                break
              fi
              echo "  可执行文件校验失败，换源"
              rm -f "$VCPKG_DIR/vcpkg"
            else
              echo "  下载失败，换源"
            fi
          done
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            echo "FAIL: 所有源都无法获取 vcpkg 可执行文件"
            exit 1
          fi
          "$VCPKG_DIR/vcpkg" version

      - name: 安装 RustDesk 系统依赖
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          # 显式用本地 files 缓存，避免 vcpkg 自动启用 x-gha（无 token 时会报错）
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
        run: |
          # 与 Windows 同理：离开 checkout 目录（避开上游 vcpkg.json 的 manifest 模式）
          WORKDIR=$(mktemp -d) && cd "$WORKDIR"
          mkdir -p "$VCPKG_ROOT/../vcpkg-bincache"
          if ! "$VCPKG_ROOT/vcpkg" install aom libvpx libyuv libjpeg-turbo opus \
            --triplet x64-osx \
            --x-install-root="$VCPKG_ROOT/installed"; then
            echo "FAIL: vcpkg 依赖安装失败"
            find "$VCPKG_ROOT/buildtrees" -name "*-rel-out.log" 2>/dev/null | head -5 | while read -r f; do
              echo "=== $f ==="; tail -30 "$f"
            done
            exit 1
          fi
          echo "=== 关键库就位校验 ==="
          LIBDIR="$VCPKG_ROOT/installed/x64-osx/lib"
          for lib in aom vpx yuv jpeg opus; do
            ls "$LIBDIR" | grep -qi "$lib" && echo "OK   $lib" || { echo "FAIL $lib"; exit 1; }
          done

      - name: 克隆源码（含 submodule）
        run: |
          git clone --depth 1 --recursive --branch "${{ needs.check-version.outputs.version }}" \
            https://github.com/rustdesk/rustdesk.git source 2>/dev/null \
            || git clone --depth 1 --recursive https://github.com/rustdesk/rustdesk.git source
          cd source && git log --oneline -1
          ls -la libs/hbb_common/src/config.rs

      - name: 注入配置
        run: bash scripts/inject-config.sh config/custom.txt source

      - name: 编译（release）
        working-directory: source
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -o pipefail
          cargo --locked build --release 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: 编译失败时输出日志尾部
        if: failure()
        run: tail -60 /tmp/build.log

      - name: 手动构造 .app 并打包为 .dmg
        run: |
          set -e
          BIN=source/target/release/rustdesk
          if [ ! -f "$BIN" ]; then echo "FAIL: 二进制未生成: $BIN"; exit 1; fi

          APP=dist/RustDesk.app
          rm -rf "$APP"; mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # 1) 主可执行文件
          cp "$BIN" "$APP/Contents/MacOS/rustdesk"
          chmod +x "$APP/Contents/MacOS/rustdesk"

          # 2) sciter 动态库（macOS 版必需，sciter-rs 构建时下载到源码根/产物目录）
          for p in source/libsciter.dylib source/target/release/libsciter.dylib libsciter.dylib; do
            if [ -f "$p" ]; then cp "$p" "$APP/Contents/MacOS/"; echo "sciter: $p"; break; fi
          done
          if [ ! -f "$APP/Contents/MacOS/libsciter.dylib" ]; then
            echo "WARN: 未找到 libsciter.dylib，尝试全盘搜索"
            find source -name 'libsciter*.dylib' 2>/dev/null | head -3
          fi
          # 让主程序能从同目录加载 libsciter.dylib
          install_name_tool -add_rpath "@executable_path" "$APP/Contents/MacOS/rustdesk" 2>/dev/null || true

          # 3) 图标（RustDesk 仓库自带 32x32/128x128 等 png）
          ICON_SRC=$(ls source/res/icon.png source/res/icon_32.png 2>/dev/null | head -1 || true)
          [ -n "$ICON_SRC" ] && cp "$ICON_SRC" "$APP/Contents/Resources/icon.png" || true

          # 4) 版本号（取自 rustdesk 源码 Cargo.toml）
          VER=$(grep -m1 '^version' source/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -z "$VER" ] && VER="1.3.9"

          # 5) Info.plist（用 printf 逐行输出，规避 YAML block scalar 与 heredoc 缩进冲突）
          PLIST="$APP/Contents/Info.plist"
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '  <key>CFBundleDevelopmentRegion</key><string>en</string>\n'
            printf '  <key>CFBundleExecutable</key><string>rustdesk</string>\n'
            printf '  <key>CFBundleIdentifier</key><string>com.carriez.rustdesk</string>\n'
            printf '  <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>\n'
            printf '  <key>CFBundleName</key><string>RustDesk</string>\n'
            printf '  <key>CFBundleDisplayName</key><string>RustDesk</string>\n'
            printf '  <key>CFBundlePackageType</key><string>APPL</string>\n'
            printf '  <key>CFBundleShortVersionString</key><string>%s</string>\n' "$VER"
            printf '  <key>CFBundleVersion</key><string>%s</string>\n' "$VER"
            printf '%s\n' '  <key>LSMinimumSystemVersion</key><string>10.14</string>'
            printf '%s\n' '  <key>NSHighResolutionCapable</key><true/>'
            printf '%s\n' '  <key>NSPrincipalClass</key><string>NSApplication</string>'
            printf '%s\n' '  <key>CFBundleIconFile</key><string>icon.png</string>'
            printf '%s\n' '  <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>'
            printf '%s\n' '  <key>CFBundleURLTypes</key>'
            printf '%s\n' '  <array><dict>'
            printf '%s\n' '    <key>CFBundleURLName</key><string>com.carriez.rustdesk</string>'
            printf '%s\n' '    <key>CFBundleURLSchemes</key><array><string>rustdesk</string></array>'
            printf '%s\n' '  </dict></array>'
            printf '  <key>NSMicrophoneUsageDescription</key><string>RustDesk 需要使用麦克风进行语音通话</string>\n'
            printf '  <key>NSCameraUsageDescription</key><string>RustDesk 需要使用摄像头进行视频通话</string>\n'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > "$PLIST"
          plutil -lint "$PLIST" 2>/dev/null || echo "WARN: plutil 校验跳过"

          # 6) 去掉隔离属性 + 打 dmg
          xattr -cr "$APP" 2>/dev/null || true
          hdiutil create -volname RustDesk -srcfolder "$APP" -ov "dist/RustDesk-macOS-x86_64.dmg"
          ls -la dist/

      - name: 校验产物
        run: |
          BIN=dist/RustDesk.app/Contents/MacOS/rustdesk
          if [ ! -f "$BIN" ]; then
            echo "FAIL: 二进制未生成: $BIN"; exit 1
          fi
          if strings "$BIN" | grep -q "fuyou135.cn"; then
            echo "OK: 产物已确认包含自建服务器地址"
          else
            echo "FAIL: 注入失败，拒绝发布"; exit 1
          fi

      - name: 收集产物
        run: |
          ls -la dist/RustDesk-macOS-x86_64.dmg || { echo "FAIL: dmg 未生成"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86-client
          path: dist/
          if-no-files-found: error

  # ============================================
  # 任务3：Linux ARM64 客户端（麒麟9000x 等）
  # ============================================
  build-linux-arm64:
    needs: check-version
    if: needs.check-version.outputs.need_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-randr0-dev libxdo-dev libxfixes-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
            libpulse-dev libva-dev libvdpau-dev libssl-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-image0-dev \
            libxcb-render-util0-dev libxcb-xinerama0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            clang cmake nasm patchelf \
            pkg-config \
            libaom-dev libvpx-dev libyuv-dev libopus-dev libjpeg-turbo8-dev

      # RustDesk 的 C/C++ 依赖（来自官方 vcpkg.json 的权威清单）：
      #   scrap        -> libyuv, libvpx(vpx), aom
      #   magnum-opus  -> opus
      #   libjpeg-turbo-> jpeg
      # 说明：
      #   - libaom-dev / libvpx-dev / libopus-dev / libjpeg-turbo8-dev 自带 .pc，无需处理
      #   - Ubuntu 的 libyuv-dev 不提供 libyuv.pc，必须手工生成
      #   - libsodium 仅 windows&arm64 需要、ffmpeg 需 static 且仅 x86/x64/win/osx，
      #     二者在 linux-arm64 上都不需要安装
      - name: 为 libyuv 生成 pkg-config 描述文件并校验全部依赖
        run: |
          ARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || echo "aarch64-linux-gnu")
          sudo tee /usr/lib/${ARCH}/pkgconfig/libyuv.pc > /dev/null <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib/${ARCH}
          includedir=\${prefix}/include

          Name: libyuv
          Description: YUV conversion and scaling library
          Version: 0.0.1
          Libs: -L\${libdir} -lyuv
          Cflags: -I\${includedir}
          EOF

          echo "=== 校验 RustDesk 所需的全部系统库 ==="
          FAILED=0
          for lib in libyuv vpx aom opus libjpeg; do
            if pkg-config --exists "$lib"; then
              echo "OK   $lib -> $(pkg-config --modversion $lib)"
            else
              echo "FAIL $lib not found by pkg-config"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || { echo "缺少依赖，中止构建"; exit 1; }
          echo "=== 全部依赖就绪 ==="

      - name: 克隆源码（含 submodule）
        run: |
          git clone --depth 1 --recursive --branch "${{ needs.check-version.outputs.version }}" \
            https://github.com/rustdesk/rustdesk.git source 2>/dev/null \
            || git clone --depth 1 --recursive https://github.com/rustdesk/rustdesk.git source
          cd source && git log --oneline -1
          ls -la libs/hbb_common/src/config.rs

      - name: 注入配置
        run: bash scripts/inject-config.sh config/custom.txt source

      # 注意：不要用 `cargo build | tail`，管道会吞掉 cargo 的退出码，
      # 导致编译失败被误判为成功。改为重定向到日志、单独 tail。
      - name: 编译
        working-directory: source
        run: |
          set -o pipefail
          cargo build --release --features linux-pkg-config 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: 编译失败时输出日志尾部
        if: failure()
        run: tail -60 /tmp/build.log

      - name: 校验产物
        run: |
          BIN=source/target/release/rustdesk
          if [ ! -f "$BIN" ]; then
            echo "FAIL: 二进制未生成: $BIN"; exit 1
          fi
          if strings "$BIN" | grep -q "fuyou135.cn"; then
            echo "OK: 产物已确认包含自建服务器地址"
            strings "$BIN" | grep "fuyou135.cn" | head -5
          else
            echo "FAIL: 产物中未找到服务器地址 —— 注入失败，拒绝发布"; exit 1
          fi

      - name: 收集产物 & 打 deb 包
        run: |
          mkdir -p dist
          cp source/target/release/rustdesk dist/rustdesk-arm64
          chmod +x dist/rustdesk-arm64
          cd source
          cargo install cargo-deb --locked 2>/dev/null || true
          cargo deb --no-build --no-strip 2>/dev/null || true
          find target -name "*.deb" -exec cp {} ../dist/ \; 2>/dev/null || true
          ls -la ../dist/
          file ../dist/rustdesk-arm64 || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-client
          path: dist/
          if-no-files-found: error

  # ============================================
  # 任务4：汇总发布 Release
  # ============================================
  release:
    needs: [check-version, build-windows, build-macos-x86, build-linux-arm64]
    if: always() && needs.check-version.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理 & 生成校验和
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \; 2>/dev/null || true
          cd release
          ls -la
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ needs.check-version.outputs.version }}
          name: "定制客户端 v${{ needs.check-version.outputs.version }}"
          body: |
            ## RustDesk 定制客户端 v${{ needs.check-version.outputs.version }}

            已内置服务器配置，**安装即用，无需手动填写任何设置**。

            | 平台 | 文件 | 适用设备 |
            |---|---|---|
            | Windows x64 | `RustDesk-Windows-x64.exe` | 主流 Windows PC |
            | macOS Intel | `RustDesk-macOS-x86_64.dmg` | Intel 芯片 Mac（M 系列可走 Rosetta） |
            | Linux ARM64 | `rustdesk-arm64` / `*.deb` | 麒麟9000x 等 ARM64 |

            ### 内置配置
            | 项目 | 值 |
            |---|---|
            | ID 服务器 | `id.fuyou135.cn` |
            | 中继服务器 | `id.fuyou135.cn` |
            | API 服务器 | `https://rd.fuyou135.cn` |
            | Key | `RxzqHWPfpghWuNd5OuapXycHg1GcqlpWeCiyRgG32U0=` |

            ### 安装说明
            - **Windows**：双击运行，首次可能需在杀软中放行
            - **macOS**：双击 `.dmg` 挂载后拖入「应用程序」；未签名需在「系统设置 → 隐私与安全性」中允许，或 `xattr -cr /Applications/RustDesk.app`
            - **Linux ARM64**：`chmod +x rustdesk-arm64 && ./rustdesk-arm64`，或 `sudo dpkg -i *.deb`

            > 安装后直接登录 `https://rd.fuyou135.cn` 的账号，即可看到名下所有设备。
          files: release/*
          fail_on_unmatched_files: false
          make_latest: false
